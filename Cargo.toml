[workspace]
members = ["xdy", "tree-sitter-xdy"]
resolver = "2"

[workspace.package]
description = "Complex RPG dice expression evaluator with probability distribution support."
version = "0.14.1"
edition = "2024"
authors = ["Todd L Smith <todd@availlang.org>"]
license = "BSD-3-Clause"
keywords = ["dice", "rpg", "xdy", "parsing"]
categories = ["compilers", "parsing", "game-development", "mathematics"]
repository = "https://github.com/toddATavail/xdy"

[workspace.dependencies]
aquamarine = "0.6"
cc = "1.5.1"
criterion = { version = "0.8.2", features = ["html_reports"] }
ebnsf = "0.1"
nom = "8.0.0"
nom-language = "0.1.0"
nom_locate = "5.0.0"
num-bigint = "0.5.1"
num-traits = "0.2.19"
pretty_assertions = "1.4.1"
proptest = { version = "1.11.0", default-features = false, features = ["std"] }
rand = "0.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tree-sitter = "0.27.0"
